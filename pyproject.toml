[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmark open-weight LLMs across heterogeneous hosts (DGX Spark -> M3 Ultra)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tiktoken>=0.7",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.scripts]
llm-bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.uv]
default-groups = []
